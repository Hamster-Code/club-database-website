<!DOCTYPE html>
<html>
<head>
    <title>SRC login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

{% with messages = get_flashed_messages() %}
    {% for message in messages %}
        <p class="flash-message">{{ message }}</p>
    {% endfor %}
{% endwith %}

<body>
    <header>
        <img src="{{ url_for('static', filename='logo.png') }}" alt="logo" style="float:left;width:100px;height:100px;"><p>
            <h1><a href="/">SRC</a></h1> <br>
            Shasta Rocketry Club<br>
        </p>
    </header>

    <main class="container">
        <h1>SRC member login</h1>
        <form action="/login" method="POST">
            <input placeholder="Name" autocomplete="off" type="text" name="username" required>
            <input placeholder="Password" autocomplete="off" type="text" name="password" required>
            <input type="submit" value="Login">
        </form>
    </main>

</body>
</html>
